# Serves the built Angular app and forwards backend paths to the API container.
# The browser sees one origin (as with the development proxy), so no CORS is involved.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Matches the API's MAX_REQUEST_BODY_BYTES (1 MiB); the API enforces it as well.
    client_max_body_size 1m;
    server_tokens off;

    # Security headers are set per location: nginx drops server-level add_header lines in
    # any location that has its own, and API responses already carry the API's headers.

    # Backend paths. X-Forwarded-For carries the real client address to the API, which
    # trusts it because only this container can reach the API (docker-compose.yml).
    location ~ ^/(api|health|ready|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # nginx's own liveness, for the container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built files have content hashes in their names: cache them for a year.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve index.html, never cached, so a new
    # release is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
