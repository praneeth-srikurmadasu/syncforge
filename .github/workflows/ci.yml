# Continuous integration for SyncForge.
#
# backend   ruff (backend and mock services), migrations applied to an empty database and
#           checked against the models, the pytest suite (PostgreSQL and Redis services)
# frontend  ESLint, Prettier, API types against the OpenAPI snapshot, unit tests, build
# stack     builds the Docker images, starts the whole stack with Docker Compose
#           (profile "full") and runs the Playwright browser tests against it
#
# No repository secrets are used. Database passwords and keys below are throwaway values
# for the CI containers only; the stack job generates its encryption key per run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: syncforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syncforge -d syncforge"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: syncforge
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: syncforge
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            mock-services/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format (backend)
        run: |
          ruff check .
          ruff format --check .
      - name: Lint and format (mock services and scripts)
        run: |
          ruff check ../mock-services ../infrastructure/scripts
          ruff format --check ../mock-services ../infrastructure/scripts
      - name: Migrations on an empty database, then compare with the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (ESLint with template accessibility rules)
        run: npx ng lint
      - name: Formatting
        run: npm run format:check
      - name: API types match the OpenAPI snapshot
        run: npm run api:check
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npx ng build --configuration production
      - name: No known vulnerabilities in what ships to browsers
        run: npm audit --omit=dev

  stack:
    name: Docker stack and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Configuration for the CI stack
        run: |
          cp .env.example .env
          # A fresh Fernet key (32 random bytes, url-safe base64) for this run only.
          echo "CONNECTOR_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> .env
      - name: Build images and start the stack
        run: docker compose --profile full up -d --build
      - name: Wait until the web app and the API answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready > /dev/null; then
              echo "ready after $((i * 3)) s"; exit 0
            fi
            sleep 3
          done
          docker compose --profile full ps
          exit 1
      - name: Containers
        run: docker compose --profile full ps -a
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser tests against the containers
        working-directory: frontend
        env:
          SF_WEB: http://localhost:8080
          SF_API: http://localhost:8080/api/v1
          SF_PAYROLL_MOCK: http://localhost:9103
        run: npm run e2e
      - name: Service logs
        if: failure()
        run: docker compose --profile full logs --no-color --tail=200
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/e2e/report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose --profile full down -v
